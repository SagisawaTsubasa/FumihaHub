name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  import-check:
    name: Import under real HA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Home Assistant
        run: pip install homeassistant==2026.1.3
      - name: Import every module under real HA
        # FXH-F-013: the offline smoke suite stubs the HA tree; this job is
        # the guard against stub/real drift (renamed or re-signed HA APIs).
        run: |
          python - <<'EOF'
          import custom_components.fumiha_hub
          import custom_components.fumiha_hub.registry
          import custom_components.fumiha_hub.web
          import custom_components.fumiha_hub.config_flow
          print("all fumiha_hub modules import cleanly under real HA")
          EOF

  smoke:
    name: Offline smoke (stubbed HA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run smoke suite
        run: python tests/smoke.py
