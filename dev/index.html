<!DOCTYPE html>
<!-- =========================================================================
  Fumiha Hub dev harness — loads the REAL shell over HTTP with a mockHass.

  Query switches (used by dev/test_panel.py and by hand):
    ?dark=1        -> themes.darkMode = true
    ?failapi=1     -> directory fetch always fails (lamp err path)
    ?badmodule=1   -> lux stub module_url points to a missing file
                      (import-failure error card path)
    ?single=1      -> only one stub page in the directory
    ?none=1        -> empty directory (zero-page empty-state card path)
    runtime: window.__vanishLux() / window.__emptyDir() mutate the live directory
    ?rev=N         -> initial directory dir_rev (default 3)
    ?earlyhass=1   -> assign hass BEFORE custom-element upgrade (pre-upgrade
                      own-property shadowing path; needs the harness script
                      to stay classic, hence no type=module here)
  window.__bumpRev() bumps dir_rev at runtime (rev-change re-render test).
========================================================================== -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fumiha Hub dev harness</title>
<style>
  html, body { margin: 0; height: 100%; }
  fumiha-hub-panel { display: block; height: 100%; }
</style>
</head>
<body>
<fumiha-hub-panel id="hub"></fumiha-hub-panel>

<!-- the REAL shell module, same URL shape HA's panel_custom module_url uses -->
<script type="module" src="/fumiha_hub/fumiha-hub.js"></script>

<script>
  var params = new URLSearchParams(location.search);

  /* ---- fixtures -------------------------------------------------------- */
  var luxModule = params.has("badmodule")
    ? "/devstub/missing-stub.js?ver=0.0.0"  // genuinely 404s -> import failure path
    : "/devstub/lux-stub.js?ver=0.0.0";
  var anlModule = "/devstub/anl-stub.js?ver=0.0.0";

  var revBase = parseInt(params.get("rev") || "3", 10);
  var revBumps = 0;
  window.__bumpRev = function () { revBumps += 1; };
  // FXH-F-029/030: vanish the lux page from the directory (integration
  // reload window) — consumed by directory() below, bump rev so the shell
  // re-evaluates its selection. __emptyDir additionally zeroes the whole
  // directory (the "selected page + directory collapsed" scenario).
  var vanished = false;
  var emptyDir = false;
  window.__vanishLux = function () { vanished = true; revBumps += 1; };
  window.__emptyDir = function () { emptyDir = true; revBumps += 1; };
  window.__restoreHub = function () { vanished = false; emptyDir = false; revBumps += 1; };

  function directory() {
    // vanished/emptyDir are runtime toggles (window.__vanishLux /
    // window.__emptyDir): they remove the lux page / zero the whole
    // directory and bump the rev, simulating an integration reload window
    // or a collapsed registry (FXH-F-029/F-030).
    var panels = params.has("none") || emptyDir ? [] : [
      ...(vanished ? [] : [{
        id: "luxbalance.main",
        title: "亮度均衡",
        icon: "mdi:lightbulb-auto",
        order: 10,
        version: "0.0.0",
        module_url: luxModule,
        element: "lux-stub-page",
      }]),
      ...(params.has("single") ? [] : [{
        id: "anl.main",
        title: "夜灯助手",
        icon: "mdi:weather-night",
        order: 20,
        version: "0.0.0",
        module_url: anlModule,
        element: "anl-stub-page",
      }]),
    ];
    return { dir_rev: revBase + revBumps, panels: panels };
  }

  /* ---- mockHass --------------------------------------------------------- */
  var failApi = params.has("failapi");

  // The dev harness has no HA theme engine, so ?dark=1 injects HA's official
  // dark-theme variables manually — tokens.css reads exactly these names.
  if (params.has("dark")) {
    var darkVars = {
      "primary-background-color": "#111111",
      "card-background-color": "#1c1c1c",
      "secondary-background-color": "#282828",
      "divider-color": "#333333",
      "primary-text-color": "#e1e1e1",
      "secondary-text-color": "#9b9b9b",
      "primary-color": "#03a9f4",
      "success-color": "#43a047",
      "warning-color": "#ffb300",
      "error-color": "#ff5252",
    };
    Object.keys(darkVars).forEach(function (k) {
      document.documentElement.style.setProperty("--" + k, darkVars[k]);
    });
  }

  var mockHass = {
    language: "zh-Hans",
    themes: { darkMode: params.has("dark") },
    callService: async function (domain, service, data) {
      console.info("[mockHass] callService", domain, service, data);
    },
    fetchWithAuth: async function (path, options) {
      if (failApi) {
        return new Response(JSON.stringify({ error: "simulated failure" }), { status: 500 });
      }
      if (path.startsWith("/api/fumiha_hub/panels")) {
        return new Response(JSON.stringify(directory()), { status: 200 });
      }
      if (path.startsWith("/api/devstub/")) {
        return new Response(JSON.stringify({ ok: true }), { status: 200 });
      }
      return new Response(JSON.stringify({ error: "no route: " + path }), { status: 404 });
    },
  };
  window.__mockHass = mockHass;

  var panel = document.getElementById("hub");

  // ?earlyhass=1: assign before the shell module executes — this lands as an
  // own property on the not-yet-upgraded element and must be re-routed by
  // the shell's connectedCallback (FXH-F-011 covers that fix).
  if (params.has("earlyhass")) {
    panel.hass = mockHass;
  }

  // Normal path mirrors HA's real order: hass assigned after upgrade.
  customElements.whenDefined("fumiha-hub-panel").then(function () {
    panel.hass = mockHass;
  });

  // Simulate HA's periodic hass pushes: entity churn must not clobber the
  // page (the shell only forwards the object; pages decide what to re-render).
  setInterval(function () {
    if (panel.isConnected) panel.hass = { ...mockHass };
  }, 3000);
</script>
</body>
</html>
